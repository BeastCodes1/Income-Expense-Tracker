<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pocket Ledger · offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f6f7fb;
        color: #172033;
        font-family: Arial, Helvetica, sans-serif;
        padding: 24px;
      }
      .card {
        max-width: 420px;
        text-align: center;
        background: #fff;
        border: 1px solid #e7eaf0;
        border-radius: 24px;
        padding: 32px 24px;
        box-shadow: 0 20px 60px -30px rgba(20, 30, 60, 0.35);
      }
      .mark {
        width: 56px;
        height: 56px;
        margin: 0 auto 18px;
        border-radius: 16px;
        background: #4f46e5;
      }
      h1 { font-size: 22px; margin: 0 0 8px; }
      p { margin: 0 0 20px; color: #64748b; line-height: 1.6; }
      a {
        display: inline-block;
        padding: 12px 20px;
        border-radius: 999px;
        background: #4f46e5;
        color: #fff;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="mark"></div>
      <h1>You're offline</h1>
      <p>Pocket Ledger needs a connection to load your saved transactions. Reconnect and try again.</p>
      <a href="/dashboard">Try again</a>
    </main>
  </body>
</html>
